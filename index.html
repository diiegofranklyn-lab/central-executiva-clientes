<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central Executiva de Clientes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="brand-mark">CE</div>
      <p class="eyebrow">D'MILA • SECURITY</p>
      <h1>Central Executiva</h1>
      <p class="subtitle">Gestão de clientes e operações</p>

      <form id="loginForm">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" required>

        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>

        <button type="submit" id="loginButton">Entrar</button>
        <p id="loginMessage" class="message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
